[package]
edition = "2021"
rust-version = "1.81"
name = "vst3-host"
version = "0.1.1"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
build = false
exclude = [
    "tests/*",
    "examples/*",
    ".github/*",
    ".gitignore",
    ".cargo/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
