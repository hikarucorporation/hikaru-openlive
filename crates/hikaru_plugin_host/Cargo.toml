[package]
name = "hikaru_plugin_host"
version = "0.1.0"
edition = "2021"

[dependencies]
hikaru_core = { path = "../hikaru_core" }
clack-host = { workspace = true }
clack-extensions = { workspace = true }
vst3-host = { workspace = true }
raw-window-handle = "0.6"
# Anillo SPSC lock-free para mandar cambios de parámetro al hilo de audio.
# El mismo crate que usa el runner de VST3, así que no suma una dependencia
# nueva al grafo: ya está en el lock por `vst3-host`.
rtrb = "0.3"
winit = "0.29"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb"] }
# Para resolver `XInitThreads` en `libX11` con `dlopen`/`dlsym`. El host
# habla con el servidor X con `x11rb`, no con Xlib: linkear contra `libX11`
# ataría el binario a una versión de Xlib que no hace falta. Ver `src/xlib.rs`.
libc = "0.2"
