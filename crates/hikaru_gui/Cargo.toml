[package]
name = "hikaru_gui"
version = "0.1.0"
edition = "2021"
authors = ["Hikaru OpenStudio Developers"]
license = "AGPL-3.0-later"

[dependencies]
hikaru_core = { path = "../hikaru_core" }
hikaru_audio_engine = { path = "../hikaru_audio_engine" }
hikaru_transport = { path = "../hikaru_transport" }
hikaru_plugin_host = { path = "../hikaru_plugin_host" }
# Render GPU offscreen (sprite sheets 2D y malla 3D de la Wavetable).
# Comparte la misma versión de wgpu que gpui-kit a través del workspace, así
# que no se compilan dos copias del backend.
hikaru_render = { path = "../hikaru_render" }
gpui-kit = "0.6.6"
# `RenderImage::new` (el tipo que usa el elemento `img` de GPUI Kit) toma un
# `image::Frame`. GPUI no lo reexporta, así que hay que declarar el crate. La
# versión tiene que ser la misma que usa `gpui-pre` o el tipo no coincide.
image = "0.25.1"
hound = "3.5"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
raw-window-handle = "0.6.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rfd = "0.15"

[[bin]]
name = "hikaru_openlive"
path = "src/main.rs"

[dev-dependencies]
# Harness headless de GPUI para tests de interacción (click_at con
# hit-testing real). Solo afecta a `cargo test`.
gpui-kit = { version = "0.6.6", features = ["test-support"] }
