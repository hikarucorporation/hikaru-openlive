[package]
name = "hikaru_gui"
version.workspace = true
edition = "2021"
authors = ["Hikaru OpenStudio Developers"]
license = "AGPL-3.0-later"

[dependencies]
hikaru_core = { path = "../hikaru_core" }
hikaru_midi = { path = "../hikaru_midi" }
hikaru_audio_engine = { path = "../hikaru_audio_engine" }
hikaru_dsp = { path = "../hikaru_dsp" }
hikaru_transport = { path = "../hikaru_transport" }
hikaru_sequencer = { path = "../hikaru_sequencer" }
hikaru_plugin_host = { path = "../hikaru_plugin_host" }
# El puerto MCP: la configuración de los slots por los que los agentes de IA
# se enganchan al DAW. Es un crate aparte para que el binario standalone del
# servidor MCP no linkee GPUI.
hikaru_mcp_port = { path = "../hikaru_mcp_port" }
# La consola: el binario `hikaru_openlive` es un dispatcher que consulta esta
# crate PRIMERO. Si el comando es de consola, sale sin inicializar GPUI ni el
# motor de audio. La crate no depende de GPUI (por eso el camino de la CLI no
# arrastra la ventana).
hikaru_cli = { path = "../hikaru_cli" }
# Render GPU offscreen (sprite sheets 2D y malla 3D de la Wavetable).
# Comparte la misma versión de wgpu que gpui-kit a través del workspace, así
# que no se compilan dos copias del backend.
hikaru_render = { path = "../hikaru_render" }
eframe = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
image = "0.25.1"
hound = "3.5"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
# Formatos de proyecto `.oplf` y `.opsf`. Son crates LGPLv3 aparte: el
# ESQUEMA del archivo no le importa a esta app, y mantenerlo acá lo ataría al
# AGPL. Lo que queda en `src/project/` es sólo la conversión entre el estado
# vivo y esos structs. Ver docs/hikaru-project-files/.
hikaru_project_file = { path = "../hikaru_project_file" }
hikaru_openlive_file = { path = "../hikaru_openlive_file" }
hikaru_openstudio_file = { path = "../hikaru_openstudio_file" }
# Los tests de round-trip necesitan leer el JSON crudo para verificar la PUREZA
# formato (que no se colen campos del otro modo).
serde_json = "1"
flate2 = "1.1"
quick-xml = "0.41"
raw-window-handle = "0.6.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "hikaru_openlive"
path = "src/main.rs"

[dev-dependencies]
hound = "3.5"
naga = { workspace = true }

[package.metadata.deb]
    name = "hikaru-openlive"
    maintainer = "Hikaru Corporation"
    copyright = "Copyright 2026 (C) Hikaru OpenLive Developers"
    license-file = ["../../LICENSE", "0"]
    extended-description = "Modular Digital Audio Workstation"
    depends = "$auto"
    section = "sound"
    priority = "optional"
    assets = [
        ["target/release/hikaru_openlive", "usr/bin/", "755"],
        ["../../assets/hikaru_openlive.desktop", "usr/share/applications/hikaru_openlive.desktop", "644"],
        ["../../assets/logos/hikaru_energy_core.svg", "usr/share/icons/hicolor/scalable/apps/hikaru_openlive.svg", "644"],
        ["../../assets/logos/hikaru_energy_core.png", "usr/share/icons/hicolor/512x512/apps/hikaru_openlive.png", "644"],
        ["../../crates/hikaru_cli/man/hikaru_openlive.1", "usr/share/man/man1/hikaru_openlive.1", "644"],
    ]
