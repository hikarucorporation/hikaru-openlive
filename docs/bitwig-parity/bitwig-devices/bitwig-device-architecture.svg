<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura real de .bwdevice y Nitro en Bitwig Studio 5.3.13">
  <title>Arquitectura real descubierta con REA en /opt/bitwig-studio</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#B4B2A9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#EF9F27"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#0d1117" rx="8"/>

  <!-- Header -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#F1EFE8">Arquitectura real de .bwdevice y Nitro en Bitwig Studio 5.3.13 (/opt/bitwig-studio)</text>
  <text x="24" y="48" font-size="11" fill="#B4B2A9">Separación entre artefactos protegidos de fábrica (BtWg 0004 + Nitro) y contratos públicos en claro (BtWg 0002)</text>

  <!-- Group 1: Factory -->
  <rect x="24" y="68" width="446" height="270" rx="8" fill="#161b22" stroke="#EF9F27" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="38" y="90" font-size="12" font-weight="700" fill="#EF9F27">Artefactos Protegidos de Fábrica (BtWg tipo 0004 + Nitro)</text>

  <rect x="38" y="106" width="202" height="58" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-opacity="0.5"/>
  <text x="139" y="129" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">150 × Library/devices/*.bwdevice</text>
  <text x="139" y="148" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Header: BtWg0003000400c5</text>

  <rect x="254" y="106" width="202" height="58" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-opacity="0.5"/>
  <text x="355" y="129" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">228 × Library/modules/*.bwmodule</text>
  <text x="355" y="148" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Header: BtWg0003000400be</text>

  <rect x="38" y="178" width="418" height="54" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-opacity="0.5"/>
  <text x="247" y="200" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">43 × Library/modulators/*.bwmodulator</text>
  <text x="247" y="218" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Header: BtWg0003000400be</text>

  <rect x="38" y="246" width="202" height="74" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-opacity="0.5"/>
  <text x="139" y="269" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Library/nitro-std</text>
  <text x="139" y="286" font-size="10.5" text-anchor="middle" fill="#B4B2A9">ZIP (24.6 MB) — *.nitro</text>
  <text x="139" y="302" font-size="10" text-anchor="middle" fill="#8b949e">smoother.nitro, note_parameters.nitro</text>

  <rect x="254" y="246" width="202" height="74" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-opacity="0.5"/>
  <text x="355" y="269" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Library/nitro-image</text>
  <text x="355" y="286" font-size="10.5" text-anchor="middle" fill="#B4B2A9">ZIP (1.77 MB) — *.nitrobin</text>
  <text x="355" y="302" font-size="10" text-anchor="middle" fill="#8b949e">second_harmonic, lrms, interleave4</text>

  <!-- Group 2: Public -->
  <rect x="490" y="68" width="446" height="270" rx="8" fill="#161b22" stroke="#1D9E75" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="504" y="90" font-size="12" font-weight="700" fill="#1D9E75">Contratos Públicos en Texto Claro (BtWg tipo 0002)</text>

  <rect x="504" y="106" width="418" height="68" rx="6" fill="#2C2C2A" stroke="#1D9E75" stroke-opacity="0.6"/>
  <text x="713" y="128" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">150 × Library/device-settings/&lt;UUID&gt;/Default.bwpreset</text>
  <text x="713" y="146" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Header: BtWg0003000200ba (cls raíz 0x561)</text>
  <text x="713" y="162" font-size="10" text-anchor="middle" fill="#1D9E75">device_id, CONTENTS, MODULATORS, Chain</text>

  <rect x="504" y="186" width="418" height="62" rx="6" fill="#2C2C2A" stroke="#1D9E75" stroke-opacity="0.6"/>
  <text x="713" y="210" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">225 × Default.bwremotecontrols</text>
  <text x="713" y="229" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Header: BtWg0003000200ba — páginas de macros y controles</text>

  <rect x="504" y="260" width="418" height="60" rx="6" fill="#2C2C2A" stroke="#1D9E75" stroke-opacity="0.6"/>
  <text x="713" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">.bwproject / .bwtemplate</text>
  <text x="713" y="303" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Cadena de dispositivos por pista: 0x164 → 0x8a → 0x144</text>

  <!-- Group 3: Engine -->
  <rect x="24" y="374" width="912" height="122" rx="8" fill="#161b22" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="38" y="396" font-size="12" font-weight="700" fill="#F1EFE8">Runtime Propietario (bin/)</text>

  <rect x="38" y="412" width="286" height="68" rx="6" fill="#2C2C2A" stroke="#5F5E5A"/>
  <text x="181" y="435" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">bin/BitwigAudioEngine-X64-AVX2</text>
  <text x="181" y="452" font-size="10.5" text-anchor="middle" fill="#B4B2A9">ELF64 (92.5 MB) · 8,762 exports</text>
  <text x="181" y="468" font-size="10" text-anchor="middle" fill="#8b949e">ramona::core + engine::AudioBuffer + nitro_*</text>

  <rect x="364" y="412" width="256" height="68" rx="6" fill="#2C2C2A" stroke="#5F5E5A"/>
  <text x="492" y="435" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">bin/libLTO.so</text>
  <text x="492" y="452" font-size="10.5" text-anchor="middle" fill="#B4B2A9">ELF64 (46.4 MB) · 78 exports</text>
  <text x="492" y="468" font-size="10" text-anchor="middle" fill="#8b949e">LLVM 19.1 ThinLTO Codegen / JIT</text>

  <rect x="656" y="412" width="266" height="68" rx="6" fill="#2C2C2A" stroke="#5F5E5A"/>
  <text x="789" y="435" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">bin/bitwig.jar</text>
  <text x="789" y="452" font-size="10.5" text-anchor="middle" fill="#B4B2A9">ZIP (32.0 MB) · 28,951 .class</text>
  <text x="789" y="468" font-size="10" text-anchor="middle" fill="#8b949e">UI/Control JVM (clases ofuscadas)</text>

  <!-- Connections -->
  <path d="M 181 338 L 181 410" stroke="#EF9F27" stroke-width="1.6" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M 324 446 L 362 446" stroke="#B4B2A9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 789 338 L 789 410" stroke="#1D9E75" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 590 320 L 290 410" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-green)"/>
</svg>
