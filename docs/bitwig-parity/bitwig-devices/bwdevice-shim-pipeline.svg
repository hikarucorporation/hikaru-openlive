<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diseño clean-room BwDeviceShim tipo Wine/Proton para Hikaru OpenLive">
  <title>Diseño del Proton/Wine Layer (BwDeviceShim) en Hikaru OpenLive</title>
  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#EF9F27"/>
    </marker>
  </defs>

  <rect width="960" height="270" fill="#0d1117" rx="8"/>
  <text x="24" y="30" font-size="14" font-weight="700" fill="#F1EFE8">Capa de Compatibilidad Clean-Room (BwDeviceShim) — Equivalente Wine/DXVK</text>
  <text x="24" y="48" font-size="11" fill="#B4B2A9">Resolución por UUID público y traducción a dispositivos nativos de Hikaru OpenLive sin desofuscar Nitro</text>

  <!-- Inputs -->
  <rect x="24" y="72" width="220" height="72" rx="6" fill="#2C2C2A" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="134" y="96" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">.bwpreset / .bwproject</text>
  <text x="134" y="114" font-size="10.5" text-anchor="middle" fill="#B4B2A9">.bwtemplate (BtWg00030002)</text>
  <text x="134" y="131" font-size="10" text-anchor="middle" fill="#1D9E75">Árbol en texto claro</text>

  <rect x="24" y="166" width="220" height="72" rx="6" fill="#2C2C2A" stroke="#EF9F27" stroke-width="1.2"/>
  <text x="134" y="190" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Drag &amp; Drop .bwdevice</text>
  <text x="134" y="208" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Cabecera BtWg00030004</text>
  <text x="134" y="225" font-size="10" text-anchor="middle" fill="#EF9F27">Identidad por nombre / UUID</text>

  <!-- Parsers -->
  <rect x="284" y="72" width="204" height="72" rx="6" fill="#161b22" stroke="#1D9E75"/>
  <text x="386" y="98" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Parser BtWg AST</text>
  <text x="386" y="116" font-size="10.5" text-anchor="middle" fill="#B4B2A9">btwg_reader.rs (simétrico</text>
  <text x="386" y="131" font-size="10.5" text-anchor="middle" fill="#B4B2A9">a btwg.rs / bwproject.rs)</text>

  <rect x="284" y="166" width="204" height="72" rx="6" fill="#161b22" stroke="#EF9F27"/>
  <text x="386" y="192" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Detector BtWg0004</text>
  <text x="386" y="210" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Resuelve preset por defecto</text>
  <text x="386" y="225" font-size="10.5" text-anchor="middle" fill="#B4B2A9">sin tocar payload Nitro</text>

  <!-- Registry -->
  <rect x="530" y="114" width="190" height="82" rx="6" fill="#2C2C2A" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="625" y="140" font-size="11.5" font-weight="700" text-anchor="middle" fill="#F1EFE8">BwCompatibilityRegistry</text>
  <text x="625" y="159" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Tabla UUID ↔ Builtin</text>
  <text x="625" y="176" font-size="10" text-anchor="middle" fill="#1D9E75">CONTENTS + MODULATORS</text>

  <!-- Host / DSP -->
  <rect x="758" y="72" width="178" height="76" rx="6" fill="#2C2C2A" stroke="#1D9E75"/>
  <text x="847" y="96" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">DSP Nativo Clean-Room</text>
  <text x="847" y="114" font-size="10.5" text-anchor="middle" fill="#B4B2A9">hikaru_dsp +</text>
  <text x="847" y="130" font-size="10.5" text-anchor="middle" fill="#B4B2A9">hikaru_native_plugins</text>

  <rect x="758" y="164" width="178" height="74" rx="6" fill="#2C2C2A" stroke="#5F5E5A"/>
  <text x="847" y="188" font-size="11.5" font-weight="600" text-anchor="middle" fill="#F1EFE8">Placeholder Lossless</text>
  <text x="847" y="206" font-size="10.5" text-anchor="middle" fill="#B4B2A9">Bypass limpio + preserva</text>
  <text x="847" y="222" font-size="10.5" text-anchor="middle" fill="#B4B2A9">sub-árbol BtWg al exportar</text>

  <!-- Arrows -->
  <path d="M 244 108 L 282 108" stroke="#1D9E75" stroke-width="1.6" fill="none" marker-end="url(#arrow-g)"/>
  <path d="M 244 202 L 282 202" stroke="#EF9F27" stroke-width="1.6" fill="none" marker-end="url(#arrow-a)"/>
  <path d="M 488 108 L 528 142" stroke="#1D9E75" stroke-width="1.6" fill="none" marker-end="url(#arrow-g)"/>
  <path d="M 488 202 L 528 168" stroke="#EF9F27" stroke-width="1.6" fill="none" marker-end="url(#arrow-a)"/>
  <path d="M 720 142 L 756 112" stroke="#1D9E75" stroke-width="1.6" fill="none" marker-end="url(#arrow-g)"/>
  <path d="M 720 168 L 756 198" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow-g)"/>
</svg>
