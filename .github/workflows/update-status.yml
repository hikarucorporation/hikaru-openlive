name: Update Bitwig 5.1.7 parity status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate status figures
        run: python3 docs/bitwig-parity/generate_status.py

      - name: Validate generated files
        run: python3 docs/bitwig-parity/generate_status.py --check

      - name: Commit changes
        run: |
          if git diff --quiet -- docs/bitwig-parity/status.svg docs/bitwig-parity/parity-detail.svg docs/bitwig-parity/features_bitwig.json; then
            echo "status figures are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bitwig-parity/status.svg docs/bitwig-parity/parity-detail.svg docs/bitwig-parity/features_bitwig.json
          git commit -m "chore(status): regenerate Bitwig 5.1.7 parity figures"
          git push
