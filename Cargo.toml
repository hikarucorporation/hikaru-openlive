[workspace]
resolver = "2"
members = [
    "crates/hikaru_core",
    "crates/hikaru_transport",
    "crates/hikaru_audio_engine",
    "crates/hikaru_sequencer",
    "crates/hikaru_dsp",
    "crates/hikaru_plugin_host",
    "crates/hikaru_midi",
    # El puerto MCP: la frontera que expone el DAW a los agentes de IA.
    # Vive aparte de la GUI para que el binario standalone del agente no
    # linkee GPUI. Ver docs/hikaru-mcp-port/.
    "crates/hikaru_mcp_port",
    # El servidor MCP: el binario que habla JSON-RPC con los agentes.
    # Es el otro lado del puerto: `hikaru_mcp_port` tiene la configuración de
    # los slots, este crate tiene el proceso que los atiende.
    "crates/hikaru_mcp",
    # La consola: el mismo binario `hikaru_openlive` con un dispatcher de
    # argumentos que responde por terminal sin inicializar GPUI. Vive aparte
    # para no linkear la ventana en el camino de la CLI.
    "crates/hikaru_cli",
    "crates/hikaru_gui",
    "crates/hikaru_audio_drivers",
    "crates/hikaru_render",
    # Formatos de archivo. LGPLv3, y NO dependen de la app: son la frontera que
    # permite a un DAW de código cerrado leer/escribir proyectos de Hikaru sin
    # abrir el motor AGPL. Ver docs/hikaru-project-files/.
    "crates/hikaru_project_file",
    "crates/hikaru_openlive_file",
    "crates/hikaru_openstudio_file",
]
# `vst3-host-patched` NO es miembro a propósito: es un path dependency, y
# promoverlo a miembro hace que cargo resuelva sus dev-dependencies (`eframe`
# 0.31, `rfd`, `env_logger`), que arrastran un egui+wgpu duplicado del que ya
# usa gpui-pre. Sus tests de audio viven entonces en
# `crates/hikaru_plugin_host/tests/`, que sí es miembro y puede alcanzar la API
# pública del host.
#
# `exclude` lo deja fuera del workspace de forma explícita (si no, cargo se
# queja de que el crate "cree estar en un workspace que no es"), y a la vez
# permite correrle los tests unitarios con
# `cargo test --manifest-path vst3-host-patched/Cargo.toml --lib`: al estar
# excluido, ese comando lo trata como su propio workspace y no arrastra las
# dev-dependencies del workspace padre.
exclude = ["vst3-host-patched"]

[workspace.package]
# Versión del producto. Es la ÚNICA fuente de verdad: la cabecera de
# `created_by` de los formatos `.oplf`/`.opsf` y la pantalla About la toman de
# acá vía `env!("CARGO_PKG_VERSION")`. No hardcodear `2.22.2` en el código.
version = "2.24.0"

[workspace.dependencies]
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["gui", "clack-host", "raw-window-handle_06", "timer", "posix-fd", "log", "params"] }
vst3-host = "0.1"
# La consola de `hikaru_openlive` (ver crates/hikaru_cli). `clap` parsea los
# argumentos; `serde_json` arma la salida JSON que consumen los agentes de IA;
# `colored` colorea el banner y los estados (se desactiva solo si la salida no
# es una terminal).
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
colored = "2"
# Versión unificada con eframe 0.31 y egui-wgpu 0.31
wgpu = "24.0.5"
# Ya viene en el grafo por wgpu/wgpu-core; declararlo explícito sólo para
# derivar `Pod`/`Zeroable` y empaquetar buffers sin `unsafe` a mano.
bytemuck = { version = "1.25", features = ["derive"] }
# Sólo para los tests: valida los shaders WGSL sin necesitar una GPU.
naga = { version = "24.0.0", features = ["wgsl-in"] }
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-wgpu = "0.31"
pollster = "0.4"

# [profile.dev]
# debug = 1

# [profile.release]
# opt-level = 3
# lto = true
# codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = 1             # Mantiene la velocidad del Release pero te da la línea exacta donde explota si tira panic.

[patch.crates-io]
vst3-host = { path = "vst3-host-patched" }